<!--
  PERKINS WEATHER - PUSH NOTIFICATION SETUP (READ ME FIRST)
  ============================================================

  Your site is fully wired for push notifications, but there's one
  piece I can't do for you: actually SENDING a push requires a
  server, and since your site is static (just HTML/CSS/JS with no
  backend), you need a notification service to handle that part.

  The free, no-code option is OneSignal. Here's the whole setup:

  STEP 1 - Create a free OneSignal account
    Go to https://onesignal.com -> Sign Up -> "New App/Website"
    Choose "Web Push" as the platform.
    Enter your site name (Perkins Weather) and your site's URL
    (whatever domain you host it on, e.g. https://yoursite.com).

  STEP 2 - Get your App ID
    OneSignal will give you an "App ID" (a long code, looks like
    8258e6b0-...). Copy it.

  STEP 3 - Paste it into onesignal-init.js
    Open onesignal-init.js (in this same folder) and replace
    YOUR-ONESIGNAL-APP-ID-HERE with the App ID you copied.

  STEP 4 - Add the OneSignal script tag to your pages
    The include is already added in the <head> of each page below.
    Nothing else to do here - just make sure onesignal-init.js
    and the OneSignal SDK script tag are on every page that should
    ask for notification permission (already done for you).

  STEP 5 - Host your site with HTTPS
    Push notifications (and PWAs generally) only work over HTTPS.
    Any normal host works: GitHub Pages, Netlify, Vercel, or your
    existing web host - as long as it serves over https://.

  STEP 6 - Send a notification
    Log into onesignal.com -> Messages -> New Push -> write your
    message -> Send. That's it - anyone who installed the app and
    allowed notifications gets it, instantly, no app store update
    or app rebuild needed.

  You can also automate sending later (e.g. "auto-notify when I
  update the forecast") using OneSignal's REST API, but manual
  sending from their dashboard is the simplest starting point.
-->
