<!-- 
  West Plains ASOS Current Temperature Widget
  Pulls live data from the National Weather Service API (station KUNO)
  Just copy this whole block into your .htm page wherever you want the widget to appear.
-->
<div id="wp-weather" style="font-family: Arial, sans-serif; max-width: 260px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center;">
  <div style="font-size: 13px; color: #666;">West Plains, MO (KUNO)</div>
  <div id="wp-temp" style="font-size: 36px; font-weight: bold; margin: 6px 0;">--°F</div>
  <div id="wp-updated" style="font-size: 11px; color: #999;">Loading...</div>
</div>

<script>
async function updateWestPlainsTemp() {
  const tempEl = document.getElementById("wp-temp");
  const updatedEl = document.getElementById("wp-updated");

  try {
    const res = await fetch("https://api.weather.gov/stations/KUNO/observations/latest", {
      headers: { "Accept": "application/geo+json" }
    });
    if (!res.ok) throw new Error("Request failed: " + res.status);
    const data = await res.json();

    const celsius = data.properties.temperature.value;
    if (celsius === null) {
      tempEl.textContent = "N/A";
      updatedEl.textContent = "No current reading";
      return;
    }

    const fahrenheit = (celsius * 9 / 5 + 32).toFixed(0);
    tempEl.textContent = fahrenheit + "°F";

    const obsTime = new Date(data.properties.timestamp);
    updatedEl.textContent = "Updated " + obsTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (err) {
    tempEl.textContent = "--°F";
    updatedEl.textContent = "Unable to load data";
    console.error("West Plains weather fetch failed:", err);
  }
}

// Load immediately, then refresh every 10 minutes
updateWestPlainsTemp();
setInterval(updateWestPlainsTemp, 10 * 60 * 1000);
</script>
